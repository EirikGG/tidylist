# The add-on's old name. It is now Tidylist (../tidylist), with a new slug, so
# Home Assistant sees it as another add-on with its own, empty /data. This one
# runs the Tidylist image, which copies the lists to /share and stops, for
# Tidylist to take over (see ../tidylist/run.sh). Remove this folder once the
# lists have been moved.
name: Shopping list (moved to Tidylist)
version: "0.13.0"
slug: shopping_list
description: Now called Tidylist. Update and start this once to move your lists, then install Tidylist
url: https://github.com/EirikGG/tidylist

image: ghcr.io/eirikgg/{arch}-addon-tidylist
arch:
  - aarch64
  - amd64
startup: once
boot: manual

environment:
  HANDOVER: export

map:
  - type: share
    read_only: false

backup: cold
