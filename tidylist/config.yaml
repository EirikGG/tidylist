name: Tidylist
version: "0.13.0"
slug: tidylist
description: Shared lists for the household, in the Home Assistant sidebar
url: https://github.com/EirikGG/tidylist

# Built and published by GitHub Actions (.github/workflows/addon.yml). HA
# fills in {arch} and downloads the tag matching version, instead of
# building the add-on on the device.
image: ghcr.io/eirikgg/{arch}-addon-tidylist
arch:
  - aarch64
  - amd64
startup: application
boot: auto

# Shown in the sidebar through ingress: HA logs the user in and passes them on.
# No ports are published, so the app is only reachable through HA.
ingress: true
ingress_port: 8099
panel_icon: mdi:format-list-checks
panel_title: Tidylist
# Every user in the household uses the lists, not only admins.
panel_admin: false

# Uses Home Assistant's MQTT broker if it has one (usually the Mosquitto
# add-on), to show the lists as entities. Runs without it otherwise.
services:
  - mqtt:want

# Where the lists are handed over from the old Shopping list add-on (run.sh).
map:
  - type: share
    read_only: false

# The database is a SQLite file in /data. A backup copied while it is being
# written to could be inconsistent, so the add-on is stopped for the backup.
backup: cold
